<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notability Entdecker-Rallye - 90 Minuten</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; background-color: #0B0C10; color: #C5C6C7;
        }

        .map-container {
            position: relative; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        .header {
            position: absolute; top: 15px; width: 100%; text-align: center;
            font-size: clamp(1.2rem, 2.5vw, 2rem); color: #66FCF1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); pointer-events: none; z-index: 5;
        }

        /* Stationen auf 6 erweitert und etwas kleiner für bessere Übersicht */
        .station {
            position: absolute; width: 10vh; height: 10vh;
            min-width: 60px; min-height: 60px; max-width: 90px; max-height: 90px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); z-index: 2;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
            transform: translate(-50%, -50%);
        }

        .station:hover {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.8);
        }

        /* Routen-Führung im Zickzack */
        .station-1 { top: 75%; left: 15%; background: radial-gradient(circle, #45A29E, #0B0C10); }
        .station-2 { top: 45%; left: 25%; background: radial-gradient(circle, #F2A900, #4A3300); }
        .station-3 { top: 20%; left: 45%; background: radial-gradient(circle, #E10600, #4D0200); }
        .station-4 { top: 40%; left: 65%; background: radial-gradient(circle, #C5C6C7, #2f3336); }
        .station-5 { top: 70%; left: 75%; background: radial-gradient(circle, #66FCF1, #103634); }
        .station-6 { top: 25%; left: 85%; background: radial-gradient(circle, #9b59b6, #361b42); }

        .station-label {
            position: absolute; top: 110%; width: 150px; text-align: center;
            font-size: 0.9rem; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px #000; pointer-events: none;
        }

        #rocket {
            position: absolute; top: 90%; left: 5%; font-size: 3rem;
            transition: top 1s ease-in-out, left 1s ease-in-out, transform 0.3s;
            z-index: 10; transform: translate(-50%, -50%) rotate(45deg); 
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); pointer-events: none;
        }
        .flying { animation: shake 0.2s infinite alternate; }
        @keyframes shake { from { margin-top: -3px; } to { margin-top: 3px; } }

        /* Modal Layout */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: #1F2833; padding: 20px; border-radius: 12px;
            width: 95%; max-width: 900px; max-height: 95vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 2px solid #66FCF1;
        }

        .modal-content h2 { margin-top: 0; color: #66FCF1; font-size: 1.5rem; margin-bottom: 10px; }
        .task-list { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; }
        .task-list li { margin-bottom: 8px; font-size: 1rem; line-height: 1.3; }

        .video-container {
            position: relative; padding-bottom: 40%; height: 0; overflow: hidden;
            border-radius: 8px; margin-bottom: 15px; background: #000; border: 1px solid #45A29E;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .btn {
            background: #66FCF1; color: #0B0C10; border: none; padding: 10px 20px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #45A29E; color: white; transform: scale(1.05); }
        .btn-secondary { background: #C5C6C7; }
        
        #start-btn { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 50; }

        /* Fake Screenshot Style via CSS & SVG */
        .result-box {
            display: none; background: #2b3036; color: white; padding: 15px;
            border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center;
            border: 1px dashed #45A29E;
        }
        .fake-screenshot {
            display: block; width: 100%; max-width: 500px; margin: 10px auto;
            border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: #ffffff; /* iPad Screen Background */
        }
    </style>
</head>
<body>

    <div class="map-container">
        <div class="header">🚀 Notability Entdecker-Rallye (90 Min)</div>
        
        <div class="station station-1" onclick="flyToStation(0)">✍️<div class="station-label">Mission 1:<br>Stift & Marker</div></div>
        <div class="station station-2" onclick="flyToStation(1)">🪄<div class="station-label">Mission 2:<br>Lasso-Magie</div></div>
        <div class="station station-3" onclick="flyToStation(2)">📐<div class="station-label">Mission 3:<br>Formen & Linien</div></div>
        <div class="station station-4" onclick="flyToStation(3)">🎙️<div class="station-label">Mission 4:<br>Audio & Bilder</div></div>
        <div class="station station-5" onclick="flyToStation(4)">📄<div class="station-label">Mission 5:<br>PDF & Import</div></div>
        <div class="station station-6" onclick="flyToStation(5)">☁️<div class="station-label">Mission 6:<br>Struktur & Backup</div></div>
        
        <div id="rocket">🚀</div>
        <button id="start-btn" class="btn">Tippe auf Station 1, um zu starten!</button>
    </div>

    <!-- Modales Fenster -->
    <div class="modal-overlay" id="mission-modal">
        <div class="modal-content">
            <h2 id="modal-title">Mission Titel</h2>
            
            <div class="video-container">
                <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="task-list">
                <strong>Deine Aufgaben für die nächsten 15 Minuten:</strong>
                <ul id="modal-tasks"></ul>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="toggleResult()" id="btn-result">👀 Lösung & Screenshot ansehen</button>
                <button class="btn" onclick="closeModal()">➔ Zurück zur Karte</button>
            </div>

            <div class="result-box" id="result-box">
                <!-- Ergebnis wird via JS eingefügt -->
            </div>
        </div>
    </div>

    <script>
        // Mockup SVGs that simulate Notability Screenshots
        const svgGrid = `<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" />`;
        const svgHeader = `<rect width="100%" height="40" fill="#f0f0f5"/><circle cx="20" cy="20" r="10" fill="#007aff"/><rect x="50" y="10" width="300" height="20" rx="5" fill="#e5e5ea"/>`;

        const missions = [
            {
                top: '75%', left: '15%',
                title: 'Mission 1: Stifte, Radierer & Marker',
                tasks: '<li>Erstelle eine Notiz namens "Test 1". Wähle das <b>karierte Papier</b> aus.</li><li>Schreibe deinen vollen Vor- und Nachnamen in Blau.</li><li>Stelle den Textmarker auf Gelb und eine dicke Stärke. Markiere deinen Vornamen (der Marker muss HINTER der Schrift liegen).</li><li>Zeichne einen langen Strich. Nutze den <b>Ganzes Objekt-Radierer</b>, um ihn mit nur einem Tippen komplett zu löschen.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/WnSlD-jdnms?rel=0',
                resultText: 'So muss deine Seite aussehen. Der Marker hebt den Text hervor, ohne das geschriebene Blau zu verdecken.<br><svg class="fake-screenshot" viewBox="0 0 400 200">'+svgHeader+svgGrid+'<rect x="70" y="80" width="120" height="30" fill="rgba(255, 235, 59, 0.5)" rx="5"/><text x="80" y="105" font-family="cursive" font-size="28" fill="blue">Max Mustermann</text></svg>'
            },
            {
                top: '45%', left: '25%',
                title: 'Mission 2: Lasso-Magie (Kopieren & Umfärben)',
                tasks: '<li>Zeichne einen großen roten Stern auf deine Seite.</li><li>Wähle das gestrichelte <b>Lasso-Werkzeug</b>. Kreise den Stern komplett ein.</li><li>Verschiebe ihn in die untere linke Ecke des Bildschirms.</li><li>Tippe einmal auf die gestrichelte Linie, gehe auf "Stil" und färbe den Stern grün!</li><li>Skaliere ihn: Ziehe ihn mit zwei Fingern größer.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/dKLn_HA5KwA?start=355&rel=0',
                resultText: 'Das Lasso-Menü (Stil) ist geöffnet, die gestrichelte Linie zeigt an, was markiert ist.<br><svg class="fake-screenshot" viewBox="0 0 400 200">'+svgHeader+svgGrid+'<path d="M100,150 l10,-30 l30,-5 l-25,-15 l10,-30 l-25,20 l-25,-20 l10,30 l-25,15 l30,5 Z" fill="none" stroke="green" stroke-width="4"/><rect x="65" y="60" width="90" height="110" fill="none" stroke="#007aff" stroke-width="2" stroke-dasharray="5,5"/><rect x="180" y="80" width="100" height="40" rx="8" fill="#333"/><text x="200" y="105" fill="white" font-family="sans-serif" font-size="14">Stil ändern</text></svg>'
            },
            {
                top: '20%', left: '45%',
                title: 'Mission 3: Formen & perfekte Geometrie',
                tasks: '<li>Zeichne freihändig ein Dreieck, aber <b>hebe den Stift am Ende NICHT ab</b>. Halte ihn gedrückt!</li><li>Beobachte, wie die App das Dreieck begradigt.</li><li>Nutze die "Füll-Funktion": Tippe auf das begradigte Dreieck, wähle "Stil" und fülle es mit Farbe.</li><li>Zeichne einen perfekten Kreis auf dieselbe Weise.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/WnSlD-jdnms?start=120&rel=0',
                resultText: 'Die unsaubere Zeichnung wurde automatisch in exakte Vektoren (scharfe Kanten) umgewandelt.<br><svg class="fake-screenshot" viewBox="0 0 400 200">'+svgHeader+svgGrid+'<polygon points="200,60 120,160 280,160" fill="rgba(255,0,0,0.2)" stroke="red" stroke-width="4"/><circle cx="320" cy="100" r="40" fill="none" stroke="blue" stroke-width="4"/></svg>'
            },
            {
                top: '40%', left: '65%',
                title: 'Mission 4: Audio-Mitschrift & Bilder',
                tasks: '<li>Tippe oben auf das <b>Mikrofon</b>. Die Aufnahme startet.</li><li>Lies laut einen Satz vor ("Das ist mein Test").</li><li>Schreibe während des Redens das Wort "Audio" auf den Bildschirm. Stoppe die Aufnahme.</li><li>Spiele die Aufnahme über den Play-Button ab. Achte auf deine Schrift!</li><li>Tippe auf das <b>+ Symbol</b> und füge ein Foto aus deiner Galerie ein. Schneide es zu.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/uYdzcXhnZYc?rel=0',
                resultText: 'Oben läuft der Audioplayer. Die geschriebene Schrift wird während des Abspielens grau und färbt sich exakt passend zur Tonspur dunkel.<br><svg class="fake-screenshot" viewBox="0 0 400 200">'+svgHeader+svgGrid+'<rect x="150" y="5" width="100" height="30" rx="15" fill="#f00"/><text x="180" y="25" fill="white" font-family="sans-serif" font-size="14">00:15 ▶</text><text x="160" y="120" font-family="cursive" font-size="30" fill="#888">Au<tspan fill="#000">dio</tspan></text></svg>'
            },
            {
                top: '70%', left: '75%',
                title: 'Mission 5: Arbeitsblätter (PDF) bearbeiten',
                tasks: '<li>Öffne Safari, suche nach einem "Blindtext PDF" (oder lade ein Arbeitsblatt aus dem Schulportal herunter).</li><li>Wähle "Teilen" (Kasten mit Pfeil) und gehe auf <b>In Notability öffnen</b>.</li><li>Importiere es als "Neue Notiz".</li><li>Nutze die Text-Funktion (T), erstelle ein Textfeld und tippe die Antworten mit der Tastatur in das PDF.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/6JHIV4e9cj4?rel=0',
                resultText: 'Das PDF ist nun Teil der Notiz. Ein getipptes Textfeld liegt exakt auf den Linien des Arbeitsblattes.<br><svg class="fake-screenshot" viewBox="0 0 400 200">'+svgHeader+'<rect x="40" y="60" width="320" height="120" fill="white" stroke="#ccc" stroke-width="1"/><text x="60" y="90" font-family="sans-serif" font-size="16" font-weight="bold">Arbeitsblatt 1</text><line x1="60" y1="130" x2="340" y2="130" stroke="#000" stroke-width="1"/><rect x="80" y="105" width="200" height="25" fill="rgba(0, 122, 255, 0.1)" stroke="#007aff" stroke-dasharray="2,2"/><text x="85" y="123" font-family="sans-serif" font-size="14" fill="#007aff">Hier ist meine Lösung</text></svg>'
            },
            {
                top: '25%', left: '85%',
                title: 'Mission 6: Ordnerstruktur & Auto-Backup',
                tasks: '<li>Gehe auf die Startseite. Tippe links oben auf das <b>+</b>.</li><li>Erstelle einen <b>Trenner</b> "Klasse 8" und darin zwei <b>Themen</b> "Mathe" und "Deutsch".</li><li>Gehe unten links ins <b>Zahnrad (Einstellungen)</b> -> <b>Auto-Backup</b>.</li><li>Wähle euren Schulserver (WebDAV/IServ) oder Google Drive. Melde dich an.</li><li><b>Wichtig:</b> Ändere unten das Dateiformat von "Note" zu "PDF", damit du deine Hefter auf jedem Gerät lesen kannst!</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/uO_fCfNYrxQ?rel=0',
                resultText: 'So muss das Backup-Menü aussehen. Der blaue Haken ist bei eurem Service gesetzt, Format steht auf PDF.<br><svg class="fake-screenshot" viewBox="0 0 400 200"><rect width="100%" height="100%" fill="#f0f0f5"/><rect x="100" y="20" width="280" height="160" fill="white" rx="10"/><text x="120" y="50" font-family="sans-serif" font-size="18" font-weight="bold">Auto-Backup</text><rect x="120" y="70" width="240" height="30" fill="#e5e5ea" rx="5"/><text x="130" y="90" font-family="sans-serif" font-size="14">✅ WebDAV / IServ</text><text x="120" y="140" font-family="sans-serif" font-size="14" fill="#666">Dateiformat:</text><rect x="220" y="125" width="60" height="20" fill="#007aff" rx="4"/><text x="235" y="140" font-family="sans-serif" font-size="12" fill="white">PDF</text></svg>'
            }
        ];

        let isFlying = false;
        const rocket = document.getElementById('rocket');
        const modal = document.getElementById('mission-modal');
        const ytPlayer = document.getElementById('youtube-player');
        const resultBox = document.getElementById('result-box');
        const btnResult = document.getElementById('btn-result');

        function flyToStation(index) {
            if (isFlying) return; 
            document.getElementById('start-btn').style.display = 'none';
            isFlying = true;
            
            rocket.classList.add('flying');
            
            // Raketen-Neigung anpassen
            let rotations = [0, 90, -45, 90, 45, -90]; 
            rocket.style.transform = `translate(-50%, -50%) rotate(${rotations[index]}deg)`;

            rocket.style.top = missions[index].top;
            rocket.style.left = missions[index].left;

            setTimeout(() => {
                rocket.classList.remove('flying');
                rocket.style.transform = 'translate(-50%, -50%) rotate(45deg)';
                showMissionInfo(index);
                isFlying = false;
            }, 1000); // Etwas schneller fliegen
        }

        function showMissionInfo(index) {
            document.getElementById('modal-title').innerText = missions[index].title;
            document.getElementById('modal-tasks').innerHTML = missions[index].tasks;
            ytPlayer.src = missions[index].youtubeUrl;
            
            resultBox.style.display = 'none';
            resultBox.innerHTML = missions[index].resultText;
            btnResult.innerText = "👀 Lösung & Screenshot ansehen";
            
            modal.classList.add('active');
        }

        function toggleResult() {
            if (resultBox.style.display === 'none' || resultBox.style.display === '') {
                resultBox.style.display = 'block';
                btnResult.innerText = "Verstecken";
                document.querySelector('.modal-content').scrollTo({
                    top: document.querySelector('.modal-content').scrollHeight,
                    behavior: 'smooth'
                });
            } else {
                resultBox.style.display = 'none';
                btnResult.innerText = "👀 Lösung & Screenshot ansehen";
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            ytPlayer.src = ''; 
        }
    </script>
</body>
</html>
