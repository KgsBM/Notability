<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notability Entdecker-Rallye</title>
    <style>
        /* Weltraum-Hintergrund & Grundlayout */
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; background-color: #0B0C10; color: #C5C6C7;
        }

        .map-container {
            position: relative; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        .header {
            position: absolute; top: 20px; width: 100%; text-align: center;
            font-size: clamp(1.5rem, 3vw, 2.5rem); color: #66FCF1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); pointer-events: none; z-index: 5;
        }

        /* Planeten (Stationen) */
        .station {
            position: absolute; width: 15vh; height: 15vh;
            min-width: 80px; min-height: 80px; max-width: 120px; max-height: 120px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); z-index: 2;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
            transform: translate(-50%, -50%);
        }

        .station:hover {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.8);
        }

        .station-1 { top: 60%; left: 20%; background: radial-gradient(circle, #45A29E, #0B0C10); }
        .station-2 { top: 30%; left: 50%; background: radial-gradient(circle, #F2A900, #4A3300); }
        .station-3 { top: 60%; left: 80%; background: radial-gradient(circle, #E10600, #4D0200); }

        .station-label {
            position: absolute; top: 105%; width: 200px; text-align: center;
            font-size: 1.1rem; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px #000; pointer-events: none;
        }

        /* Rakete */
        #rocket {
            position: absolute; top: 90%; left: 10%; font-size: 4rem;
            transition: top 1.2s ease-in-out, left 1.2s ease-in-out, transform 0.3s;
            z-index: 10; transform: translate(-50%, -50%) rotate(45deg); 
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); pointer-events: none;
        }
        .flying { animation: shake 0.2s infinite alternate; }
        @keyframes shake { from { margin-top: -5px; } to { margin-top: 5px; } }

        /* Modal (Popup) Layout */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: #1F2833; padding: 20px 30px; border-radius: 15px;
            width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 2px solid #66FCF1;
        }

        .modal-content h2 { margin-top: 0; color: #66FCF1; font-size: clamp(1.2rem, 2vw, 1.6rem); }
        .modal-content p, .task-list li { font-size: clamp(0.9rem, 1.2vw, 1.1rem); line-height: 1.4; }
        
        .task-list {
            background: rgba(255,255,255,0.05); padding: 15px 30px; border-radius: 8px;
            margin-bottom: 20px; text-align: left;
        }

        /* Video Container */
        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            border-radius: 10px; margin-bottom: 20px; background: #000; border: 1px solid #45A29E;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Buttons & Ergebnisse */
        .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        
        .btn {
            background: #66FCF1; color: #0B0C10; border: none; padding: 12px 25px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
        }
        .btn:hover { background: #45A29E; color: white; transform: scale(1.05); }
        
        .btn-secondary { background: #C5C6C7; color: #0B0C10; box-shadow: none; }
        .btn-secondary:hover { background: #e0e0e0; }

        #start-btn { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 50; }

        .result-box {
            display: none; background: #45A29E; color: white; padding: 15px;
            border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: left;
        }
    </style>
</head>
<body>

    <div class="map-container">
        <div class="header">🚀 Notability Entdecker-Rallye</div>
        
        <!-- Stationen -->
        <div class="station station-1" onclick="flyToStation(0)">🛠️<div class="station-label">Mission 1:<br>Basisfunktionen</div></div>
        <div class="station station-2" onclick="flyToStation(1)">📄<div class="station-label">Mission 2:<br>PDF & Multimedia</div></div>
        <div class="station station-3" onclick="flyToStation(2)">☁️<div class="station-label">Mission 3:<br>Backup & Struktur</div></div>
        
        <div id="rocket">🚀</div>
        <button id="start-btn" class="btn">Tippe auf einen Planeten, um zu starten!</button>
    </div>

    <!-- Modales Fenster -->
    <div class="modal-overlay" id="mission-modal">
        <div class="modal-content">
            <h2 id="modal-title">Mission Titel</h2>
            
            <div class="video-container">
                <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="task-list">
                <strong>Deine Aufgaben auf dem iPad:</strong>
                <ul id="modal-tasks">
                    <!-- Aufgaben werden via JS eingefügt -->
                </ul>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="toggleResult()" id="btn-result">👀 Beispielergebnis ansehen</button>
                <button class="btn" onclick="closeModal()">➔ Zurück zur Karte</button>
            </div>

            <div class="result-box" id="result-box">
                <!-- Ergebnis wird via JS eingefügt -->
            </div>
        </div>
    </div>

    <script>
        const missions = [
            {
                top: '60%', left: '20%',
                title: 'Mission 1: Die Werkzeugkiste',
                tasks: '<li>Erstelle eine neue Notiz und nenne sie "Test".</li><li>Schreibe deinen Namen in deiner Lieblingsfarbe.</li><li>Markiere die Selbstlaute (Vokale) mit dem Textmarker.</li><li>Zeichne einen Stern und verschiebe ihn mit dem Lasso-Werkzeug.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/WnSlD-jdnms?rel=0',
                resultText: '✅ So sieht es richtig aus: Dein Name steht in der Notiz, Teile davon sind farbig hinterlegt (der Textmarker überdeckt die Schrift nicht). Der gezeichnete Stern befindet sich nun an einer ganz anderen Stelle als du ihn ursprünglich gezeichnet hast.'
            },
            {
                top: '30%', left: '50%',
                title: 'Mission 2: PDFs & Multimedia',
                tasks: '<li>Zeichne freihändig ein Dreieck und halte den Stift am Ende gedrückt, bis es gerade wird.</li><li>Starte oben eine Audio-Aufnahme, sprich etwas ein und schreibe <i>gleichzeitig</i> ein Wort auf.</li><li>Lade ein PDF-Dokument (z.B. aus dem Internet) in Notability.</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/6JHIV4e9cj4?rel=0',
                resultText: '✅ So sieht es richtig aus: Das Dreieck hat perfekte, gerade Kanten. Wenn du deine Audio-Aufnahme abspielst (Play-Symbol), wird das von dir geschriebene Wort passend zum Ton animiert (es taucht auf oder wird hell hervorgehoben).'
            },
            {
                top: '60%', left: '80%',
                title: 'Mission 3: Lebensretter Auto-Backup',
                tasks: '<li>Lege auf der Startseite einen neuen "Trenner" (Ordner) namens "Schuljahr 24" an.</li><li>Erstelle darin ein "Thema" namens "Mathe".</li><li>Gehe unten links in die Einstellungen auf "Auto-Backup" und richte deine Cloud (WebDAV/IServ) ein.</li><li>Stelle das Dateiformat dort zwingend auf "PDF".</li>',
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/uO_fCfNYrxQ?rel=0',
                resultText: '✅ So sieht es richtig aus: In der Ordnerleiste links ist alles sauber einsortiert. In den Einstellungen ist bei "Auto-Backup" ein blauer Haken bei eurem Cloud-Dienst gesetzt und unter "Ziel" bzw. "Dateiformat" steht "PDF". Wenn dein iPad nun kaputt geht, sind alle Mitschriften sicher!'
            }
        ];

        let isFlying = false;
        const rocket = document.getElementById('rocket');
        const modal = document.getElementById('mission-modal');
        const ytPlayer = document.getElementById('youtube-player');
        const resultBox = document.getElementById('result-box');
        const btnResult = document.getElementById('btn-result');

        function flyToStation(index) {
            if (isFlying) return; 
            document.getElementById('start-btn').style.display = 'none';
            isFlying = true;
            
            rocket.classList.add('flying');
            if (index === 0) rocket.style.transform = 'translate(-50%, -50%) rotate(0deg)'; 
            if (index === 1) rocket.style.transform = 'translate(-50%, -50%) rotate(45deg)';
            if (index === 2) rocket.style.transform = 'translate(-50%, -50%) rotate(90deg)';

            rocket.style.top = missions[index].top;
            rocket.style.left = missions[index].left;

            setTimeout(() => {
                rocket.classList.remove('flying');
                rocket.style.transform = 'translate(-50%, -50%) rotate(45deg)';
                showMissionInfo(index);
                isFlying = false;
            }, 1200);
        }

        function showMissionInfo(index) {
            document.getElementById('modal-title').innerText = missions[index].title;
            document.getElementById('modal-tasks').innerHTML = missions[index].tasks;
            ytPlayer.src = missions[index].youtubeUrl;
            
            // Ergebnis-Box verstecken und mit neuem Text füllen
            resultBox.style.display = 'none';
            resultBox.innerHTML = missions[index].resultText;
            btnResult.innerText = "👀 Beispielergebnis ansehen";
            
            modal.classList.add('active');
        }

        function toggleResult() {
            if (resultBox.style.display === 'none' || resultBox.style.display === '') {
                resultBox.style.display = 'block';
                btnResult.innerText = "Verstecken";
                // Scrollt innerhalb des Modals sanft nach unten zum Ergebnis
                document.querySelector('.modal-content').scrollTo({
                    top: document.querySelector('.modal-content').scrollHeight,
                    behavior: 'smooth'
                });
            } else {
                resultBox.style.display = 'none';
                btnResult.innerText = "👀 Beispielergebnis ansehen";
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            ytPlayer.src = ''; 
        }
    </script>
</body>
</html>
