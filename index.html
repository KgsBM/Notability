<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notability Entdecker-Rallye</title>
    <style>
        /* Grundlegendes Styling und Weltraum-Hintergrund */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #0B0C10;
            color: #C5C6C7;
        }

        .map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Ein einfacher Sternenhintergrund mittels CSS */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        /* Überschrift */
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            color: #66FCF1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            z-index: 5;
        }

        /* Planeten (Die Stationen) */
        .station {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        .station-1 { top: 60%; left: 15%; background: radial-gradient(circle, #45A29E, #0B0C10); }
        .station-2 { top: 25%; left: 45%; background: radial-gradient(circle, #F2A900, #4A3300); }
        .station-3 { top: 55%; left: 75%; background: radial-gradient(circle, #E10600, #4D0200); }

        .station-label {
            position: absolute;
            top: 110px;
            width: 160px;
            left: -30px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        /* Rakete und Animation */
        #rocket {
            position: absolute;
            top: 85%;
            left: 5%;
            font-size: 4rem;
            /* Weiche Animation von Position zu Position */
            transition: top 2.5s ease-in-out, left 2.5s ease-in-out, transform 0.5s;
            z-index: 10;
            transform: rotate(45deg); /* Start-Neigung */
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        .flying {
            /* Simuliert ein Wackeln während des Flugs */
            animation: shake 0.3s infinite alternate;
        }

        @keyframes shake {
            from { transform: rotate(40deg) translateY(-5px); }
            to { transform: rotate(50deg) translateY(5px); }
        }

        /* Modal (Popup-Fenster für die Videos) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.4s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #1F2833;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #66FCF1;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #66FCF1;
            font-size: 1.8rem;
        }

        .modal-content p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* YouTube iFrame Container (Responsive) */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 25px;
            background: #000;
            border: 1px solid #45A29E;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Buttons */
        .btn {
            background: #66FCF1;
            color: #0B0C10;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.4);
        }

        .btn:hover {
            background: #45A29E;
            color: white;
            transform: scale(1.05);
        }

        #start-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
        
        #start-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>

    <div class="map-container">
        <div class="header">🚀 Notability Entdecker-Rallye</div>

        <!-- Station 1 -->
        <div class="station station-1">
            🛠️
            <div class="station-label">Mission 1:<br>Basisfunktionen</div>
        </div>

        <!-- Station 2 -->
        <div class="station station-2">
            📄
            <div class="station-label">Mission 2:<br>PDF & Multimedia</div>
        </div>

        <!-- Station 3 -->
        <div class="station station-3">
            ☁️
            <div class="station-label">Mission 3:<br>Backup & Struktur</div>
        </div>

        <!-- Die Rakete -->
        <div id="rocket">🚀</div>

        <!-- Start Button -->
        <button id="start-btn" class="btn" onclick="startRallye()">Rallye starten!</button>
    </div>

    <!-- Modales Fenster (Popup) -->
    <div class="modal-overlay" id="mission-modal">
        <div class="modal-content">
            <h2 id="modal-title">Mission Titel</h2>
            <p id="modal-text">Aufgabenbeschreibung...</p>
            
            <div class="video-container">
                <!-- iFrame lädt dynamisch das jeweilige YouTube-Video -->
                <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <button class="btn" onclick="completeMission()">Mission abgeschlossen! Weiter ➔</button>
        </div>
    </div>

    <script>
        // Daten für die einzelnen Stationen (Koordinaten und Inhalte)
        // Koordinaten (top/left) orientieren sich an der Mitte der Planeten
        const missions = [
            {
                top: '56%', left: '16%',
                title: 'Mission 1: Die Werkzeugkiste',
                text: 'Schau dir das Video zu den Basisfunktionen an. Erstelle danach eine neue Notiz, probiere Stifte, Textmarker und das magische Lasso-Werkzeug aus!',
                // Video: "Basiswissen Notability"
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/WnSlD-jdnms?rel=0'
            },
            {
                top: '21%', left: '46%',
                title: 'Mission 2: PDFs & Arbeitsblätter',
                text: 'Wie kommen Arbeitsblätter in Notability? Schau dir an, wie man PDFs importiert. Probiere außerdem die Audio-Aufnahme-Funktion (Mikrofon oben) beim Schreiben aus!',
                // Video: "Notability - PDF Importieren"
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/6JHIV4e9cj4?rel=0'
            },
            {
                top: '51%', left: '76%',
                title: 'Mission 3: Lebensretter Auto-Backup',
                text: 'Der absolut wichtigste Schritt! Richte dein automatisches Backup über WebDAV / euren Schulserver ein, damit nie wieder Mitschriften verloren gehen.',
                // Video: "App Notability Back Up und WebDAV"
                youtubeUrl: 'https://www.youtube-nocookie.com/embed/uO_fCfNYrxQ?rel=0'
            }
        ];

        let currentMission = 0;
        const rocket = document.getElementById('rocket');
        const modal = document.getElementById('mission-modal');
        const startBtn = document.getElementById('start-btn');
        const ytPlayer = document.getElementById('youtube-player');

        function startRallye() {
            startBtn.style.display = 'none'; // Verstecke Start-Button
            currentMission = 0;
            flyToStation(currentMission);
        }

        function flyToStation(index) {
            // Wackel-Animation einschalten (Flugmodus)
            rocket.classList.add('flying');
            
            // Rakete neigt sich in Flugrichtung (vereinfacht)
            if (index === 1) rocket.style.transform = 'rotate(15deg)'; 
            if (index === 2) rocket.style.transform = 'rotate(75deg)';

            // Rakete zu den Koordinaten der nächsten Station bewegen
            rocket.style.top = missions[index].top;
            rocket.style.left = missions[index].left;

            // Warte, bis die CSS-Transition (2.5 Sekunden) fertig ist
            setTimeout(() => {
                rocket.classList.remove('flying'); // Wackeln stoppen
                rocket.style.transform = 'rotate(45deg)'; // Wieder aufrichten
                showMissionInfo(index);
            }, 2500);
        }

        function showMissionInfo(index) {
            // Inhalte in das Modal laden
            document.getElementById('modal-title').innerText = missions[index].title;
            document.getElementById('modal-text').innerText = missions[index].text;
            ytPlayer.src = missions[index].youtubeUrl;
            
            // Modal anzeigen (Einblenden)
            modal.classList.add('active');
        }

        function completeMission() {
            // Modal ausblenden und Video stoppen (src leeren)
            modal.classList.remove('active');
            ytPlayer.src = ''; 

            currentMission++;

            if (currentMission < missions.length) {
                // Kurze Pause, dann zur nächsten Station fliegen
                setTimeout(() => {
                    flyToStation(currentMission);
                }, 500);
            } else {
                // Rallye beendet
                setTimeout(() => {
                    alert("Herzlichen Glückwunsch! Du hast deinen digitalen Notability-Führerschein bestanden. Deine Notizen sind nun sicher und perfekt organisiert!");
                    // Rakete fliegt aus dem Bildrand
                    rocket.classList.add('flying');
                    rocket.style.top = '-20%';
                    rocket.style.left = '100%';
                }, 500);
            }
        }
    </script>
</body>
</html>
